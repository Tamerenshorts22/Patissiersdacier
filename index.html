<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11100f">
<title>Patissiers d'Acier</title>
<style>
:root{--ui:rgba(255,255,255,.94);--muted:rgba(255,255,255,.62);--line:rgba(255,255,255,.34)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11100f;color:#fff;font-family:Inter,Arial,sans-serif}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}.film{position:relative;width:100%;height:100%;min-height:100svh;overflow:hidden;user-select:none}.film video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}.vignette{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.2),transparent 30%,transparent 64%,rgba(0,0,0,.34))}.ui{transition:opacity .45s ease,transform .45s ease}.hidden .ui{opacity:0;pointer-events:none}.brand{position:absolute;top:clamp(22px,4vw,52px);left:clamp(22px,4vw,60px);text-shadow:0 1px 18px rgba(0,0,0,.35)}.company{font-size:clamp(13px,1vw,16px);letter-spacing:.18em;font-weight:500;text-transform:uppercase}.tagline{margin-top:6px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.65}.player{position:absolute;left:clamp(22px,5vw,76px);right:clamp(22px,5vw,76px);bottom:clamp(22px,4.2vw,54px)}.timeline-meta{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.13em;opacity:.63;margin-bottom:10px;text-transform:uppercase}.timeline{position:relative;height:22px;touch-action:none}.track,.progress{position:absolute;top:10px;left:0;height:1px}.track{width:100%;background:var(--line)}.progress{background:rgba(255,255,255,.96)}.playhead{position:absolute;top:5px;width:1px;height:11px;background:#fff;transform:translateX(-.5px);box-shadow:0 0 8px rgba(255,255,255,.25)}.controls-row{display:flex;justify-content:space-between;align-items:center;margin-top:3px}.transport,.right-controls{display:flex;align-items:center;gap:15px}.transport button,.right-controls button{min-width:26px;height:26px;padding:0;font-size:10px;letter-spacing:.12em;opacity:.72;transition:opacity .2s ease,transform .2s ease}.transport button:hover,.right-controls button:hover{opacity:1;transform:translateY(-1px)}.transport .play{font-size:13px;opacity:.95}@media(max-width:640px){.tagline{display:none}.player{left:18px;right:18px;bottom:max(18px,env(safe-area-inset-bottom))}.controls-row{margin-top:4px}.transport,.right-controls{gap:8px}.transport button,.right-controls button{min-width:30px}}
</style>
</head>
<body>
<main class="film" id="film">
  <video id="video" src="video.mp4" autoplay muted playsinline preload="auto"></video>
  <div class="vignette"></div>
  <div class="brand ui"><div class="company" id="company"></div><div class="tagline" id="tagline"></div></div>
  <section class="player ui" aria-label="Video controls">
    <div class="timeline-meta"><span id="currentTime">00:00</span><span id="duration">00:00</span></div>
    <div class="timeline" id="timeline" role="slider" tabindex="0" aria-label="Video timeline">
      <div class="track"></div><div class="progress" id="progress"></div><span class="playhead" id="playhead"></span>
    </div>
    <div class="controls-row">
      <div class="transport"><button id="prev" aria-label="Previous frame" title="Previous frame">↼</button><button class="play" id="play" aria-label="Play">▶</button><button id="next" aria-label="Next frame" title="Next frame">⇀</button></div>
      <div class="right-controls"><button id="fullscreen">FULL</button></div>
    </div>
  </section>
</main>
<script>
/* =========================================================
   EDIT HERE. This is the only configuration you should need.
   Current supplied video: 1280x720, 24 FPS, ~8 seconds.
   ========================================================= */
const CONFIG={
  companyName:"Pâtissiers d'Acier",
  tagline:"Aucun Coco n'Est Trop Gros",
  fps:24

};
const film=document.getElementById('film'),video=document.getElementById('video'),timeline=document.getElementById('timeline'),progress=document.getElementById('progress'),playhead=document.getElementById('playhead'),currentTime=document.getElementById('currentTime'),duration=document.getElementById('duration'),playBtn=document.getElementById('play');
let raf=0,hideTimer=0,scrubbing=false;
document.getElementById('company').textContent=CONFIG.companyName;document.getElementById('tagline').textContent=CONFIG.tagline;
const fmt=s=>{s=Number.isFinite(s)?Math.max(0,Math.floor(s)):0;return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function show(){film.classList.remove('hidden');clearTimeout(hideTimer);hideTimer=setTimeout(()=>film.classList.add('hidden'),2800)}
function render(){const d=video.duration||0,t=video.currentTime||0,p=d?t/d*100:0;currentTime.textContent=fmt(t);duration.textContent=fmt(d);progress.style.width=p+'%';playhead.style.left=p+'%';if(!video.paused)raf=requestAnimationFrame(render)}
function startRender(){cancelAnimationFrame(raf);raf=requestAnimationFrame(render)}
function seek(x){const r=timeline.getBoundingClientRect(),d=video.duration||0;video.currentTime=Math.max(0,Math.min(1,(x-r.left)/r.width))*d;render()}
function frame(dir){video.pause();video.currentTime=Math.max(0,Math.min(video.duration||0,video.currentTime+dir/CONFIG.fps));render();show()}
function togglePlay(){if(video.paused)video.play().catch(()=>{});else video.pause();show()}
function toggleFull(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.().catch(()=>{});show()}
video.muted=true;video.addEventListener('play',()=>{video.muted=true;playBtn.textContent='Ⅱ';startRender()});video.addEventListener('pause',()=>{playBtn.textContent='▶';cancelAnimationFrame(raf);render()});
timeline.addEventListener('pointerdown',e=>{scrubbing=true;timeline.setPointerCapture(e.pointerId);seek(e.clientX);show()});timeline.addEventListener('pointermove',e=>{if(scrubbing)seek(e.clientX)});timeline.addEventListener('pointerup',()=>scrubbing=false);timeline.addEventListener('pointercancel',()=>scrubbing=false);
video.addEventListener('pointerup',e=>{if(e.target===video)togglePlay()});
document.getElementById('play').onclick=togglePlay;document.getElementById('prev').onclick=()=>frame(-1);document.getElementById('next').onclick=()=>frame(1);document.getElementById('fullscreen').onclick=toggleFull;
document.addEventListener('pointermove',show);document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(e.code==='Space'){e.preventDefault();togglePlay()}else if(e.key==='ArrowLeft'){e.preventDefault();frame(-1)}else if(e.key==='ArrowRight'){e.preventDefault();frame(1)}else if(e.key.toLowerCase()==='f')toggleFull();show()});
show();video.play().catch(()=>{});render();
</script>
</body>
</html>
